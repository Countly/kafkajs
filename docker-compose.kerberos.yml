services:
  kdc:
    image: ${KDC_IMAGE:?supply a pinned cached KDC image}
    pull_policy: never
    container_name: kafkajs-kdc
    hostname: kdc
    labels: ["custom.project=kafkajs", "custom.service=kdc"]
    ports: ["127.0.0.1:88:88/tcp", "127.0.0.1:88:88/udp"]
    volumes:
      - ${KERBEROS_FIXTURE_DIR:?supply the owned fixture directory}:/state
      - ./testHelpers/kerberos/krb5.kdc.conf:/etc/krb5.conf:ro
      - ./testHelpers/kerberos/kdc.conf:/var/lib/krb5kdc/kdc.conf:ro
      - ./testHelpers/kerberos/start-kdc.sh:/fixture/start-kdc.sh:ro
    environment:
      KRB5_KDC_PROFILE: /var/lib/krb5kdc/kdc.conf
    command: ["bash", "/fixture/start-kdc.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/state/ready"]
      interval: 1s
      timeout: 1s
      retries: 60
  kafka1:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    pull_policy: never
    container_name: kafka1
    hostname: kafka1
    labels: ["custom.project=kafkajs", "custom.service=kafka1"]
    depends_on:
      kdc:
        condition: service_healthy
    ports: ["127.0.0.1:9092:9092", "127.0.0.1:9192:9192"]
    volumes:
      - ${KERBEROS_FIXTURE_DIR:?supply the owned fixture directory}:/state:ro
      - ./testHelpers/kerberos/krb5.kdc.conf:/etc/krb5.conf:ro
      - ./testHelpers/kerberos/server-jaas.conf:/etc/kafka/server-jaas.conf:ro
    environment:
      CLUSTER_ID: 9JrAXWqaTk-meTZW2p46oA
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: CONTROLLER://:19093,INTERNAL://:29092,PLAINTEXT_HOST://:9092,GSSAPI_HOST://:9192
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,PLAINTEXT_HOST://localhost:9092,GSSAPI_HOST://localhost:9192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,GSSAPI_HOST:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_LISTENER_NAME_GSSAPI_HOST_GSSAPI_SASL_JAAS_CONFIG: com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true doNotPrompt=true keyTab="/state/kafka.keytab" principal="kafka/localhost@KAFKAJS.TEST";
      KAFKA_CONNECTIONS_MAX_REAUTH_MS: "15000"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/server-jaas.conf -Djava.security.krb5.conf=/etc/krb5.conf
