# 3-node KRaft cluster (combined broker+controller) on the official apache/kafka image.
# Host ports keep the layout testHelpers/index.js expects. Controller quorum is static (see spec C1).
x-kafka-common: &kafka-common
  image: apache/kafka:${KAFKA_VERSION:-4.3.1}
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: 'broker,controller'
    KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:19093,2@kafka2:19093,3@kafka3:19093'
    KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
    KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,SSL_HOST:SSL,SASL_SSL_HOST:SASL_SSL'
    CLUSTER_ID: '9JrAXWqaTk-meTZW2p46oA'
    KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    KAFKA_DEFAULT_REPLICATION_FACTOR: '2'
    KAFKA_NUM_PARTITIONS: '2'
    KAFKA_DELETE_TOPIC_ENABLE: 'true'
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '2'
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '2'
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
    KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: '2'
    KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: '1'
    KAFKA_CONNECTIONS_MAX_REAUTH_MS: '15000'
    KAFKA_AUTHORIZER_CLASS_NAME: 'org.apache.kafka.metadata.authorizer.StandardAuthorizer'
    KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'true'
    KAFKA_SUPER_USERS: 'User:ANONYMOUS'
    KAFKA_SSL_KEYSTORE_LOCATION: '/etc/kafka/secrets/kafka.server.keystore.jks'
    KAFKA_SSL_KEYSTORE_PASSWORD: 'testtest'
    KAFKA_SSL_KEY_PASSWORD: 'testtest'
    KAFKA_SSL_TRUSTSTORE_LOCATION: '/etc/kafka/secrets/kafka.server.truststore.jks'
    KAFKA_SSL_TRUSTSTORE_PASSWORD: 'testtest'
    KAFKA_SASL_ENABLED_MECHANISMS: 'PLAIN,SCRAM-SHA-256,SCRAM-SHA-512'
    KAFKA_OPTS: '-Djava.security.auth.login.config=/etc/kafka/secrets/server-jaas.conf'
  volumes:
    - ./testHelpers/certs/kafka.server.keystore.jks:/etc/kafka/secrets/kafka.server.keystore.jks:ro,z
    - ./testHelpers/certs/kafka.server.truststore.jks:/etc/kafka/secrets/kafka.server.truststore.jks:ro,z
    - ./testHelpers/kafka/server-jaas.conf:/etc/kafka/secrets/server-jaas.conf:ro,z

services:
  kafka1:
    <<: *kafka-common
    hostname: kafka1
    container_name: kafka1
    labels: ['custom.project=kafkajs', 'custom.service=kafka1']
    ports: ['9092:9092', '9093:9093', '9094:9094']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '1'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9092,SSL_HOST://0.0.0.0:9093,SASL_SSL_HOST://0.0.0.0:9094,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:19093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,SSL_HOST://localhost:9093,SASL_SSL_HOST://localhost:9094,INTERNAL://kafka1:29092'

  kafka2:
    <<: *kafka-common
    hostname: kafka2
    container_name: kafka2
    labels: ['custom.project=kafkajs', 'custom.service=kafka2']
    ports: ['9095:9095', '9096:9096', '9097:9097']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '2'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9095,SSL_HOST://0.0.0.0:9096,SASL_SSL_HOST://0.0.0.0:9097,INTERNAL://0.0.0.0:29095,CONTROLLER://0.0.0.0:19093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9095,SSL_HOST://localhost:9096,SASL_SSL_HOST://localhost:9097,INTERNAL://kafka2:29095'

  kafka3:
    <<: *kafka-common
    hostname: kafka3
    container_name: kafka3
    labels: ['custom.project=kafkajs', 'custom.service=kafka3']
    ports: ['9098:9098', '9099:9099', '9100:9100']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '3'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9098,SSL_HOST://0.0.0.0:9099,SASL_SSL_HOST://0.0.0.0:9100,INTERNAL://0.0.0.0:29098,CONTROLLER://0.0.0.0:19093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9098,SSL_HOST://localhost:9099,SASL_SSL_HOST://localhost:9100,INTERNAL://kafka3:29098'

  # An independent single-node KRaft cluster: different cluster id, its own controller quorum,
  # host port 9192, and deliberately no custom.project label so the test harness scripts
  # (waitForKafka.js, createScramCredentials.sh) ignore it. It exists so a test can watch a
  # client move to a cluster that shares nothing with the one it started on.
  kafkaFresh:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    container_name: kafkaFresh
    ports: ['9192:9192']
    environment:
      KAFKA_NODE_ID: 9
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '9@kafkaFresh:19193'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9192,INTERNAL://0.0.0.0:29192,CONTROLLER://0.0.0.0:19193'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9192,INTERNAL://kafkaFresh:29192'
      CLUSTER_ID: 'kUZ1qC3XSHi1nT6vlP4Zpg'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_NUM_PARTITIONS: '1'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
