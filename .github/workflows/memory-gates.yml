    needs: [select]
    if: contains(fromJSON(needs.select.outputs.jobs), 'telemetry-verdicts')
    uses: ./.github/workflows/telemetry.yml
    with:
      full: true
      memory-verdicts: true
  telemetry-verdict-controls:
    needs: [select]
    if: contains(fromJSON(needs.select.outputs.jobs), 'telemetry-verdict-controls')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with: { node-version: 24, cache: npm }
      - run: npm ci
        timeout-minutes: 5
      - name: Require broker-free ownership, resource, health and share-envelope controls
        timeout-minutes: 3
        run: |
          mkdir -p .tmp/telemetry-verdict-controls
          timeout -k 5s 150s node node_modules/jest/bin/jest.js --runInBand --ci --detectOpenHandles --reporters=./testHelpers/quietReporter.js --runTestsByPath scripts/e2e/telemetry/__tests__/memoryVerdicts.spec.js testHelpers/__tests__/telemetryFixtures.spec.js --json --outputFile=.tmp/telemetry-verdict-controls/results.json
      - if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-verdict-controls-node24
          path: .tmp/telemetry-verdict-controls/
          if-no-files-found: error
          include-hidden-files: true
  verdict:
    name: memory-gates-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [select, unit, share-soak-verdict, resources, journal-controls, retained-diagnostic, telemetry-soak, telemetry-seeded-control, live-owner-census, telemetry-verdicts, telemetry-verdict-controls]
    if: always() && needs.select.result == 'success'
    steps:
      - name: Require every relocated memory gate
        timeout-minutes: 1
        env:
          FULL: ${{ needs.select.outputs.full }}
          ONLY: ${{ inputs.only }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          if (process.env.FULL !== 'true')
            throw new Error(`partial selection (only=${process.env.ONLY || ''}) is not a memory-gates pass`)
          const results = JSON.parse(process.env.RESULTS)
          for (const [name, job] of Object.entries(results))
            if (job.result !== 'success') throw new Error(`${name}: ${job.result}`)
          NODE
