name: Load profile (diagnostic)
# Runs one load profile (scripts/soak/loadRun.js) against the repository's three-broker Kafka 4.4.0
# Compose cluster on a hosted 4-core runner, within 30 minutes, and uploads its sealed artifact
# (header.json binds every file by SHA-256). The step exits with the profile's verdict: 0 pass,
# 1 product failure (the sequence oracle found loss, a duplicate, a reordering or a skipped commit),
# 2 inconclusive, 3 rate not reached (the runner could not offer the load: no claim either way).
# Diagnostic only: it gates nothing. A push to a branch named p12/load-profile* runs it with every
# default, since a dispatch-only workflow must first exist on the default branch.
on:
  workflow_dispatch:
    inputs:
      rate:
        description: Target records per second, all producers together
        type: choice
        options: ['5000', '10000', '20000', '30000', '50000']
        default: '10000'
      record_bytes:
        description: Record value size in bytes
        type: choice
        options: ['200', '1024', '4096']
        default: '1024'
      topics:
        description: Topics
        type: choice
        options: ['1', '4', '12', '48']
        default: '12'
      partitions:
        description: Partitions per topic
        type: choice
        options: ['1', '6', '16', '64']
        default: '16'
      duration:
        description: Offer window in seconds
        type: choice
        options: ['300', '600', '900']
        default: '600'
      compression:
        description: Compression codec
        type: choice
        options: ['none', 'gzip', 'snappy', 'lz4', 'zstd']
        default: 'none'
      faults:
        description: Fault schedule
        type: choice
        options: ['rolling-restarts', 'none']
        default: 'rolling-restarts'
      node:
        description: Node.js major version
        type: choice
        options: ['26', '24', '22']
        default: '26'
  push:
    branches: ['p12/load-profile*']
permissions:
  contents: read
concurrency:
  group: load-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAFKA_VERSION: '4.4.0'
      COMPOSE_FILE: docker-compose.yml
      LOAD_OUT: ${{ github.workspace }}/.tmp/load-profile
      LOAD_TREE_SHA: ${{ github.sha }}
      LOAD_RATE: ${{ inputs.rate || '30000' }}
      LOAD_RECORD_BYTES: ${{ inputs.record_bytes || '1024' }}
      LOAD_TOPICS: ${{ inputs.topics || '48' }}
      LOAD_PARTITIONS: ${{ inputs.partitions || '64' }}
      LOAD_DURATION: ${{ inputs.duration || '600' }}
      LOAD_COMPRESSION: ${{ inputs.compression || 'none' }}
      LOAD_FAULTS: ${{ inputs.faults || 'rolling-restarts' }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: ${{ inputs.node || '26' }}
          cache: npm
      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci
      - name: Pull the broker image
        timeout-minutes: 3
        run: timeout -k 5s 150s docker pull "apache/kafka:$KAFKA_VERSION"
      - name: Run the load profile
        timeout-minutes: 24
        env:
          DO_NOT_STOP: '1'
          SKIP_SCRAM: '1'
        # The command string is evaluated by testWithKafka.sh; it names environment variables only,
        # each set from a choice input, so no input text reaches the shell.
        run: |
          timeout -k 30s 1410s ./scripts/testWithKafka.sh 'node scripts/soak/loadRun.js --out "$LOAD_OUT" --rate "$LOAD_RATE" --record-bytes "$LOAD_RECORD_BYTES" --topics "$LOAD_TOPICS" --partitions "$LOAD_PARTITIONS" --duration "$LOAD_DURATION" --compression "$LOAD_COMPRESSION" --faults "$LOAD_FAULTS"'
      - name: Print the report
        if: always()
        timeout-minutes: 1
        run: |
          if [ -f "$LOAD_OUT/report.json" ]; then
            node -e 'const r = require(process.argv[1]); console.log(JSON.stringify({ verdict: r.verdict, rate: r.rate, latencyMs: r.latencyMs, eventLoopDelayMs: r.eventLoopDelayMs, findings: r.oracle && Object.fromEntries(Object.entries(r.oracle.findings).map(([k, f]) => [k, f.count])), reads: r.oracle && r.oracle.reads, faults: r.faults, errors: r.errors }, null, 2))' "$LOAD_OUT/report.json"
          else
            echo "no report: the driver stopped before writing it"
          fi
      - name: Stop the cluster
        if: always()
        timeout-minutes: 2
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans || true
      - name: Upload the artifact
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@v4
        with:
          name: load-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/load-profile/
          if-no-files-found: error
          include-hidden-files: true
