name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Frozen master SHA
        required: true
        default: '15bde169275115fc35ebae219b75dd5bf29b3ee1'
      candidate:
        description: Frozen candidate SHA (also the A/A baseline)
        required: true
        default: '3722ee45c8670d7d66f3f0b3c27e1a1546852f9d'
permissions:
  contents: read
jobs:
  frame-comparison:
    name: ${{ matrix.comparison }}-${{ matrix.partition }}
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        comparison: [master-pr]
        partition: [frame-other]
    env:
      BASELINE: ${{ matrix.comparison == 'aa' && inputs.candidate || inputs.baseline }}
      CANDIDATE: ${{ inputs.candidate }}
      PARTITION: ${{ matrix.partition }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Record frozen trees and runner
        run: |
          git rev-parse HEAD
          git rev-parse "$BASELINE^{commit}"
          node --version
          lscpu
      - name: Measure the unchanged exit-gate partition
        run: |
          node scripts/benchmarks/compareDecoderBounds.js --run \
            --baseline "$BASELINE" --partition "$PARTITION" \
            --seed 20261113 --out .tmp/decoder-comparison.json \
            --raw .tmp/decoder-raw
      # A/A deliberately retains the same-SHA structural failure; its intervals are diagnostic.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-${{ matrix.comparison }}-${{ matrix.partition }}
          path: |
            .tmp/decoder-comparison.json
            .tmp/decoder-raw
          include-hidden-files: true
          if-no-files-found: error
