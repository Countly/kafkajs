# needs flags: java (JDK + cached client/codec jars), lz4 (native binding),
# consumerGroupStates (patched coordinator image), kerberos (KDC image/state),
# tls-required (tracked TLS fixtures), tokens, logdirs (compose-only), tiered (test jar/remote dir).
# Future guarded live specs must also supply their reservation through check.env.
name: Exit gate
on:
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated check ids; empty runs all
        required: false
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}-${{ github.event.pull_request.draft == true }}
  cancel-in-progress: true
env:
  KAFKA_VERSION: 4.3.1
  # Required before enabling the corresponding future arm; no digest is assumed.
  KDC_BASE_IMAGE: ''
  TIERED_JAR_SHA256: ''
jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const gate = JSON.parse(fs.readFileSync('scripts/ci/gate.json', 'utf8'))
          if (gate.version !== 1 || !Array.isArray(gate.checks)) throw new Error('Unsupported gate manifest')
          const ids = gate.checks.map(check => check.id)
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate check ids')
          const only = (process.env.ONLY || '').split(',').map(id => id.trim()).filter(Boolean)
          for (const id of only) {
            if (!ids.includes(id)) throw new Error(`Unknown check: ${id}`)
          }
          const include = gate.checks.filter(check => !only.length || only.includes(check.id))
            .map(({ id, capMinutes }) => {
              if (!/^[a-z0-9][a-z0-9-]*$/.test(id) || !Number.isInteger(capMinutes) || capMinutes < 1) {
                throw new Error(`Invalid matrix entry: ${id}`)
              }
              return { id, capMinutes }
            })
          if (!include.length) throw new Error('No checks selected')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`)
          NODE

  check:
    needs: plan
    name: ${{ matrix.id }}
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.capMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CHECK_ID: ${{ matrix.id }}
      DO_NOT_STOP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Read check
        id: entry
        run: |
          node <<'NODE'
          const fs = require('fs')
          const check = JSON.parse(fs.readFileSync('scripts/ci/gate.json', 'utf8')).checks
            .find(check => check.id === process.env.CHECK_ID)
          if (!check) throw new Error('Check missing from manifest')
          const supported = ['java', 'lz4', 'consumerGroupStates', 'kerberos', 'tls-required', 'tokens', 'logdirs', 'tiered']
          for (const key of Object.keys(check.needs || {})) {
            if (!supported.includes(key)) throw new Error(`Unsupported needs flag: ${key}`)
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/check.json`, JSON.stringify(check))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `check=${JSON.stringify(check)}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `COMPOSE_FILE=${check.compose || 'docker-compose.yml'}\n`)
          NODE
      - uses: actions/setup-java@v4
        if: fromJSON(steps.entry.outputs.check).needs.java || fromJSON(steps.entry.outputs.check).needs.consumerGroupStates || fromJSON(steps.entry.outputs.check).compose == 'testHelpers/consumerGroupStates/compose.yml'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        if: fromJSON(steps.entry.outputs.check).needs.java
        with:
          path: ${{ runner.temp }}/gate-java
          key: gate-java-v1-kafka-4.3.1-slf4j-1.7.36-snappy-1.1.10.7-lz4-1.8.0-zstd-1.5.6-10
      - name: Prepare verified Java jars
        if: fromJSON(steps.entry.outputs.check).needs.java
        run: |
          mkdir -p "$RUNNER_TEMP/gate-java"
          while read -r coordinate; do
            jar="$RUNNER_TEMP/gate-java/${coordinate##*/}"
            url="https://repo.maven.apache.org/maven2/$coordinate"
            if [ ! -s "$jar" ]; then curl --fail --location --retry 3 --max-time 120 "$url" -o "$jar"; fi
            digest="$(curl --fail --location --retry 3 --max-time 120 "$url.sha1")"
            [[ "$digest" =~ ^[[:xdigit:]]{40}$ ]]
            printf '%s  %s\n' "$digest" "$jar" | sha1sum --check -
          done <<'JARS'
          org/apache/kafka/kafka-clients/4.3.1/kafka-clients-4.3.1.jar
          org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar
          org/xerial/snappy/snappy-java/1.1.10.7/snappy-java-1.1.10.7.jar
          org/lz4/lz4-java/1.8.0/lz4-java-1.8.0.jar
          com/github/luben/zstd-jni/1.5.6-10/zstd-jni-1.5.6-10.jar
          JARS
          echo "JAVA_E2E_WORK_DIR=$RUNNER_TEMP/gate-java" >> "$GITHUB_ENV"
          echo "JAVA_VECTORS_WORK_DIR=$RUNNER_TEMP/gate-java" >> "$GITHUB_ENV"
          echo 'JAVA_E2E_OFFLINE=1' >> "$GITHUB_ENV"
          echo "JAVA_CODEC_CLASSPATH=$RUNNER_TEMP/gate-java/*" >> "$GITHUB_ENV"
      - name: Require native LZ4
        if: fromJSON(steps.entry.outputs.check).needs.lz4
        run: node -e "require('lz4-napi')"
      - name: Build coordinator fixture
        if: fromJSON(steps.entry.outputs.check).needs.consumerGroupStates || fromJSON(steps.entry.outputs.check).compose == 'testHelpers/consumerGroupStates/compose.yml'
        run: |
          bash ./testHelpers/consumerGroupStates/build.sh "$KAFKA_VERSION" "$RUNNER_TEMP/coordinator-build"
          mkdir -p testHelpers/consumerGroupStates/runtime
          chmod 777 testHelpers/consumerGroupStates/runtime
          docker build --build-arg KAFKA_VERSION="$KAFKA_VERSION" -t "consumer-group-states:$KAFKA_VERSION" testHelpers/consumerGroupStates
      - name: Check TLS fixtures
        if: fromJSON(steps.entry.outputs.check).needs['tls-required']
        run: |
          test -s testHelpers/certs/kafka.server.keystore.jks
          test -s testHelpers/certs/kafka.server.truststore.jks
          test -s testHelpers/certs/cert-signed
      - name: Build Kerberos fixture
        if: fromJSON(steps.entry.outputs.check).needs.kerberos
        run: |
          [[ "$KDC_BASE_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || { echo 'Set KDC_BASE_IMAGE to a pinned image containing MIT Kerberos tools'; exit 1; }
          docker build --build-arg KDC_BASE_IMAGE="$KDC_BASE_IMAGE" -t gate-kdc:local testHelpers/kerberos
          docker pull "apache/kafka:$KAFKA_VERSION"
          mkdir -p "$RUNNER_TEMP/kerberos"
          chmod 777 "$RUNNER_TEMP/kerberos"
          echo 'KDC_IMAGE=gate-kdc:local' >> "$GITHUB_ENV"
          echo "KERBEROS_FIXTURE_DIR=$RUNNER_TEMP/kerberos" >> "$GITHUB_ENV"
          echo 'WAIT_FOR_KAFKA_NODES=kafka1' >> "$GITHUB_ENV"
          echo 'SKIP_SCRAM=1' >> "$GITHUB_ENV"
      - name: Prepare tiered storage
        if: fromJSON(steps.entry.outputs.check).needs.tiered
        run: |
          [[ "$TIERED_JAR_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'Set TIERED_JAR_SHA256 to the audited Maven artifact digest'; exit 1; }
          mkdir -p testHelpers/kafka/plugins "$RUNNER_TEMP/tiered-remote"
          chmod 777 "$RUNNER_TEMP/tiered-remote"
          jar=testHelpers/kafka/plugins/kafka-storage-4.3.1-test.jar
          curl --fail --location --retry 3 --max-time 120 https://repo.maven.apache.org/maven2/org/apache/kafka/kafka-storage/4.3.1/kafka-storage-4.3.1-test.jar -o "$jar"
          printf '%s  %s\n' "$TIERED_JAR_SHA256" "$jar" | sha256sum --check -
          echo "TIERED_REMOTE_DIR=$RUNNER_TEMP/tiered-remote" >> "$GITHUB_ENV"
      - name: Run check
        id: run
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { spawnSync, execFileSync } = require('child_process')
          const check = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/check.json`, 'utf8'))
          const env = { ...process.env, ...check.env,
            ...(check.nodeTest ? { NODE_TEST_REPORT: `${process.env.RUNNER_TEMP}/node-tests.tap` } : {}),
            KAFKAJS_TREE: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() }
          const quote = value => "'" + String(value).replace(/'/g, "'\\''") + "'"
          const command = check.jestScript
            ? ['npm', 'run', check.jestScript, '--', '--ci', '--json',
              `--outputFile=${process.env.RUNNER_TEMP}/report.json`].map(quote).join(' ')
            : check.jest
            ? ['env', ...Object.entries(check.env || {}).map(([key, value]) => `${key}=${value}`),
              'node', 'node_modules/jest/bin/jest.js', ...check.jest, '--ci', '--json',
              `--outputFile=${process.env.RUNNER_TEMP}/report.json`].map(quote).join(' ')
            : check.command
          if (!command) throw new Error('Check has neither jest nor command')
          const result = check.kind === 'cluster'
            ? spawnSync('./scripts/testWithKafka.sh', [command], { env, stdio: 'inherit' })
            : spawnSync('bash', ['-eo', 'pipefail', '-c', command], { env, stdio: 'inherit' })
          if (result.error) console.error(result.error)
          process.exitCode = result.status ?? 1
          NODE
      - name: Verify test identities
        if: always() && steps.run.outcome != 'skipped' && (fromJSON(steps.entry.outputs.check).jest != null || fromJSON(steps.entry.outputs.check).jestScript != null)
        run: node scripts/ci/checkIdentities.js "$RUNNER_TEMP/report.json" "$CHECK_ID"
      - name: Verify Node tests
        if: always() && steps.run.outcome != 'skipped' && fromJSON(steps.entry.outputs.check).nodeTest != null
        run: node scripts/ci/checkNodeTests.js "$RUNNER_TEMP/node-tests.tap" "$CHECK_ID"
      - name: Verify evidence against checked-out tree and observed broker
        if: always() && steps.run.outcome != 'skipped' && fromJSON(steps.entry.outputs.check).evidence[0] != null
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { spawnSync } = require('child_process')
          const { readBrokerVersion } = require('./testHelpers/brokerVersion')
          const check = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/check.json`, 'utf8'))
          const files = check.evidence.map(name => {
            if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name)) throw new Error('Invalid evidence name')
            return `.tmp/e2e/${name}.jsonl`
          })
          const result = spawnSync(process.execPath, ['scripts/evidence/verify.js', '--broker', readBrokerVersion(), ...files], { stdio: 'inherit' })
          process.exitCode = result.status ?? 1
          NODE
      - name: Collect compose logs
        if: always() && fromJSON(steps.entry.outputs.check).kind == 'cluster'
        run: docker compose -f "$COMPOSE_FILE" logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1
      - name: Stop cluster
        if: always() && fromJSON(steps.entry.outputs.check).kind == 'cluster'
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-${{ matrix.id }}
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/node-tests.tap
            .tmp/gate-sweeps/
            .tmp/e2e/
            coverage/coverage-summary.json
            coverage/lcov.info
            ${{ runner.temp }}/compose.log
      - name: Record result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          node -e 'require("fs").writeFileSync(`${process.env.RUNNER_TEMP}/${process.env.CHECK_ID}.json`, JSON.stringify({id: process.env.CHECK_ID, result: process.env.RESULT}))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-result-${{ matrix.id }}
          retention-days: 14
          path: ${{ runner.temp }}/${{ matrix.id }}.json

  verdict:
    needs: [plan, check]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-result-*
          path: results
          merge-multiple: true
      - name: Summarize results
        if: always()
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const matrix = JSON.parse(process.env.MATRIX || '{"include":[]}')
          const rows = matrix.include.map(({ id }) => {
            const file = `results/${id}.json`
            return { id, result: fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')).result : 'missing' }
          })
          const summary = ['| Check id | Result |', '| --- | --- |', ...rows.map(({ id, result }) => `| ${id} | ${result} |`)]
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n')
          if (process.env.PLAN_RESULT !== 'success' || process.env.CHECK_RESULT !== 'success' || rows.some(row => row.result !== 'success')) process.exitCode = 1
          NODE
