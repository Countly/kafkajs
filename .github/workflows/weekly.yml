name: Weekly full matrix
on:
  schedule: [{ cron: '0 3 * * 1' }]
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        node: [22, 24, 26]
        kafka: ['4.0.2', '4.2.2', '4.3.2', '4.4.0']
        group: [broker, admin, producer, consumer, others, oauthbearer]
        exclude:
          - { node: 26, kafka: '4.0.2' }
          - { node: 22, kafka: '4.2.2' }
          - { node: 24, kafka: '4.3.2' }
    env:
      MATRIX_GROUP: ${{ matrix.group }}
      KAFKA_VERSION: ${{ matrix.kafka }}
      COMPOSE_FILE: ${{ matrix.group == 'oauthbearer' && 'docker-compose.oauthbearer.yml' || 'docker-compose.yml' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: ./scripts/testWithKafka.sh "npm run test:group:$MATRIX_GROUP -- --ci --maxWorkers=4"
