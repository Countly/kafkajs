name: Telemetry lanes
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        required: true
      memory-verdicts:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          FULL: ${{ inputs.full }}
          MEMORY_VERDICTS: ${{ inputs.memory-verdicts }}
        run: |
          node <<'NODE'
          const configured = 'docker-compose.telemetry.yml'
          const base = 'docker-compose.yml'
          const both = ['4.3.1', '4.2.2']
          const noPlugin = ['4.3.1', '4.2.2', '4.1.2', '4.0.2']
          const lanes = [
            ...[
              'telemetry-reporter',
              'telemetry-prefix',
              'telemetry-custom',
              'telemetry-payload',
              'telemetry-java',
              'telemetry-outcomes',
              'telemetry-shutdown',
            ].map((group) => ({ group, compose: configured, full: both, dev: ['4.3.1'] })),
            { group: 'telemetry-base', compose: base, full: noPlugin, dev: ['4.3.1', '4.4.0'] },
            { group: 'telemetry-unsupported', compose: base, full: noPlugin, dev: ['4.3.1'] },
            { group: 'telemetry-outcomes', compose: base, full: ['4.1.2'], dev: [] },
          ]
          const memory = process.env.MEMORY_VERDICTS === 'true'
          const selected = memory ? lanes.filter((lane) =>
            ['telemetry-outcomes', 'telemetry-unsupported', 'telemetry-shutdown'].includes(lane.group)) : lanes
          const full = process.env.FULL === 'true'
          const include = []
          for (const node of full ? [22, 24, 26] : [24])
            for (const lane of selected)
              for (const kafka of full ? lane.full : lane.dev)
                include.push({ node, kafka, group: lane.group, compose: lane.compose })
          // The base 4.4.0 development smoke is additional coverage, not an exit obligation.
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`)
          NODE
  resources:
    if: ${{ !inputs.memory-verdicts }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.full && '[22, 24, 26]' || '[24]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
        timeout-minutes: 5
      - name: Run the bounded-resource schedules
        timeout-minutes: 30
        env:
          TMPDIR: ${{ runner.temp }}
          TELEMETRY_RESOURCES_QUIET: '1'
        run: timeout -k 10s 1750s node --expose-gc node_modules/jest/bin/jest.js --runInBand --ci --detectOpenHandles --testPathPatterns 'src/telemetry/__tests__/resources\.spec\.js$' --testNamePattern '^(?!.*resource memory for)'
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      KAFKA_VERSION: ${{ matrix.kafka }}
      COMPOSE_FILE: ${{ matrix.compose }}
      COMPOSE_PROJECT_NAME: telemetry-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      TF1_CACHE: ${{ github.workspace }}/.tmp/telemetry-cache
      TELEMETRY_JAVA_CACHE: ${{ github.workspace }}/.tmp/telemetry-cache
      TELEMETRY_DECODER_ARCHIVE: ${{ github.workspace }}/.tmp/telemetry-cache/decoder-${{ matrix.kafka }}.jsa
      TELEMETRY_INTEROP_CACHE: ${{ github.workspace }}/.tmp/telemetry-interop
      TELEMETRY_EVIDENCE_DIR: ${{ github.workspace }}/.tmp/telemetry-evidence
      KAFKAJS_LANE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - if: matrix.compose == 'docker-compose.telemetry.yml'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
        timeout-minutes: 5
      - name: Prepare telemetry evidence
        timeout-minutes: 1
        run: |
          echo "KAFKAJS_TREE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p .tmp/e2e "$TELEMETRY_EVIDENCE_DIR"
          chmod 0777 "$TELEMETRY_EVIDENCE_DIR"
      - name: Verify retained jars offline and prepare decoder inputs
        if: matrix.compose == 'docker-compose.telemetry.yml'
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          timeout -k 5s 30s env -u TELEMETRY_JAVA_CACHE bash scripts/e2e/telemetry/run.sh verify "$KAFKA_VERSION"
          timeout -k 5s 180s bash scripts/e2e/telemetry/fetch.sh
          timeout -k 5s 30s bash scripts/e2e/telemetry/run.sh verify "$KAFKA_VERSION"
          timeout -k 5s 60s node scripts/e2e/telemetry/prepareDecoder.js
      - name: Fetch and verify the pinned Java interop jars
        if: matrix.group == 'telemetry-java'
        timeout-minutes: 4
        run: timeout -k 5s 200s bash scripts/e2e/telemetry/fetch-interop.sh
      - name: Run reporter ordering and observer checks with the independent Java decoder
        if: matrix.group == 'telemetry-reporter' && matrix.kafka == '4.3.1'
        timeout-minutes: 4
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          timeout -k 5s 60s bash scripts/e2e/telemetry/test-reporter-order.sh
          timeout -k 10s 150s npx jest --runInBand --ci --testPathPatterns 'testHelpers/__tests__/telemetryFixtures\.spec\.js$'
      - name: Preflight isolated project ownership
        timeout-minutes: 2
        run: timeout -k 5s 90s node scripts/e2e/telemetry/ci.js preflight
      - name: Prepare broker image
        timeout-minutes: 4
        run: timeout -k 5s 210s docker compose -f "$COMPOSE_FILE" pull
      - name: Start and warm the owned telemetry cluster
        timeout-minutes: 6
        run: |
          timeout -k 5s 90s docker compose -f "$COMPOSE_FILE" up -d --pull never
          timeout -k 5s 240s node scripts/waitForKafka.js
      - name: Verify mounted reporter and capture broker identities
        timeout-minutes: 3
        run: timeout -k 5s 150s node scripts/e2e/telemetry/ci.js capture
      - name: Run telemetry lane
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: timeout -k 10s 270s npm run test:group:${{ matrix.group }} -- --ci
      - name: Verify telemetry evidence before teardown
        if: always()
        timeout-minutes: 3
        run: |
          timeout -k 5s 150s node <<'NODE'
          const fs = require('fs')
          const { spawnSync } = require('child_process')
          const { readBrokerVersion } = require('./testHelpers/brokerVersion')
          const { verifyEvidence } = require('./scripts/e2e/telemetry/evidence')
          const files = fs.readdirSync('.tmp/e2e').filter(name => name.endsWith('.jsonl'))
            .map(name => `.tmp/e2e/${name}`)
          const result = spawnSync(process.execPath, [
            'scripts/evidence/verify.js', '--broker', readBrokerVersion(), ...files,
          ], { stdio: 'inherit', timeout: 60000 })
          if (result.error) throw result.error
          if (result.status !== 0) throw new Error('Evidence stamp verification failed')
          verifyEvidence('${{ matrix.group }}', process.env.TELEMETRY_EVIDENCE_DIR, files)
          NODE
      - name: Require archived socket ownership and shutdown resource acceptance
        if: ${{ always() && inputs.memory-verdicts }}
        timeout-minutes: 3
        run: |
          timeout -k 5s 150s node <<'NODE'
          const fs = require('fs')
          const { verifyMemoryEvidence } = require('./scripts/e2e/telemetry/memoryVerdicts')
          const files = fs.readdirSync('.tmp/e2e').filter(name => name.endsWith('.jsonl'))
            .map(name => `.tmp/e2e/${name}`)
          verifyMemoryEvidence('${{ matrix.group }}', process.env.TELEMETRY_EVIDENCE_DIR, files)
          NODE
      - name: Stop owned project and prove container network volume removal
        if: always()
        timeout-minutes: 3
        run: |
          timeout -k 5s 150s node scripts/e2e/telemetry/ci.js stop
          node -e "require('./scripts/e2e/telemetry/evidence').verifyCleanup(process.env.TELEMETRY_EVIDENCE_DIR, '.tmp/e2e', process.env.COMPOSE_PROJECT_NAME)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group }}-${{ matrix.kafka }}-node${{ matrix.node }}
          path: |
            .tmp/e2e/
            .tmp/telemetry-evidence/
            .tmp/telemetry-cache/decoder-*.jsa.json
          if-no-files-found: error
          include-hidden-files: true
