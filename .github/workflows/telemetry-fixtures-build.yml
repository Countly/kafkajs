name: Telemetry fixtures build (temporary)
# Builds the Kafka 4.4.0 telemetry fixture jars with provenance. Delete this file after the artifacts are committed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/e2e/telemetry/fixtures/**
      - scripts/e2e/telemetry/fetch.sh
      - scripts/e2e/telemetry/build.sh
      - scripts/e2e/telemetry/CountingTelemetryReporter.java
      - scripts/e2e/telemetry/JavaTelemetryClient.java
      - .github/workflows/telemetry-fixtures-build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFKA_IMAGE: apache/kafka:4.4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Set telemetry fixture cache path
        timeout-minutes: 1
        run: echo "TF1_CACHE=$RUNNER_TEMP/tf1-cache" >> "$GITHUB_ENV"
      - name: Fetch and verify the pinned build inputs
        timeout-minutes: 5
        run: bash scripts/e2e/telemetry/fetch.sh
      - name: Build the 4.4.0 jars twice and require identical bytes
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for pass in a b; do
            TF1_WORK="$RUNNER_TEMP/work-$pass" TF1_OUT="$RUNNER_TEMP/out-$pass" bash scripts/e2e/telemetry/build.sh 4.4.0
          done
          for jar in counting-telemetry-reporter-4.4.0.jar java-telemetry-client-4.4.0.jar otlp-v1.9.0-bindings-unrelocated.jar; do
            cmp "$RUNNER_TEMP/out-a/$jar" "$RUNNER_TEMP/out-b/$jar"
          done
      - name: Collect the jars with their input, output and image identities
        timeout-minutes: 6
        run: |
          set -euo pipefail
          collected="$RUNNER_TEMP/collected"
          mkdir -p "$collected"
          cp "$RUNNER_TEMP"/out-a/counting-telemetry-reporter-4.4.0.jar "$RUNNER_TEMP"/out-a/java-telemetry-client-4.4.0.jar "$collected/"
          docker pull --quiet "$KAFKA_IMAGE"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "javac: $(javac -version 2>&1)"
            echo "== input sha256 (verified by fetch.sh)"
            cat scripts/e2e/telemetry/fixtures/inputs.sha256
            echo "== output sha256 (two builds were byte-identical)"
            (cd "$collected" && sha256sum ./*.jar)
            echo "== image"
            docker image inspect "$KAFKA_IMAGE" --format 'imageId: {{.Id}}'
            docker image inspect "$KAFKA_IMAGE" --format 'repoDigests: {{json .RepoDigests}}'
            echo "imageJava: $(docker run --rm --entrypoint java "$KAFKA_IMAGE" -version 2>&1 | sed -n 2p)"
            echo "version: $(docker run --rm --entrypoint /opt/kafka/bin/kafka-topics.sh "$KAFKA_IMAGE" --version 2>&1 | tail -n 1)"
            docker run --rm --entrypoint sh "$KAFKA_IMAGE" -c 'sha256sum /opt/kafka/libs/kafka-clients-*.jar /opt/kafka/libs/protobuf-java-*.jar /opt/kafka/libs/opentelemetry-proto-*.jar' || echo 'image jar digests unavailable'
          } | tee "$collected/provenance.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-fixtures-4.4.0
          path: ${{ runner.temp }}/collected/
          if-no-files-found: error
