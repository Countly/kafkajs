name: CI
on:
  push: { branches: [master] }
  pull_request:
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Integration groups, comma-separated (empty runs all; e.g. share-base,admin)'
        required: false
        type: string
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run compat:check
      - run: npm run test:types
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: { node: [22, 24, 26] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run test:unit -- --testPathIgnorePatterns 'scripts/soak/__tests__/soak\.spec\.js$'
  unit-soak:
    runs-on: ubuntu-latest
    # The slowest shard (Node 22) measured about 590 s of tests on 2026-11-10; 15 minutes leaves room for setup.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { node: [22, 24, 26], shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run test:unit:soak -- --ci --shard=${{ matrix.shard }}/3
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:pack
  otel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:otel
  integration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_LANES: ${{ inputs.lanes }}
        run: node scripts/ci/integrationPlan.js >> "$GITHUB_OUTPUT"
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 20 }}
    needs: [unit, integration-plan]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.integration-plan.outputs.matrix) }}
    env:
      KAFKA_VERSION: ${{ matrix.kafka }}
      COMPOSE_FILE: ${{ matrix.compose || 'docker-compose.yml' }}
      KAFKA_CLIENTS_VERSION: ${{ matrix.clients || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: docker compose version
      - if: ${{ !startsWith(matrix.group, 'share') }}
        run: ./scripts/testWithKafka.sh "npm run test:group:${{ matrix.group }} -- --ci --maxWorkers=4"
      - name: Prepare share evidence
        if: startsWith(matrix.group, 'share')
        run: |
          echo "KAFKAJS_TREE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          rm -rf .tmp/e2e
          mkdir -p .tmp/e2e
      - name: Run share lane
        if: startsWith(matrix.group, 'share')
        env:
          DO_NOT_STOP: '1'
        run: ./scripts/testWithKafka.sh "npm run test:group:${{ matrix.group }} -- --ci"
      - name: Prove shutdown exits naturally
        if: matrix.group == 'share'
        env:
          KAFKAJS_LANE: docker
          KAFKAJS_DEBUG_PROTOCOL_BUFFERS: '1'
          SHARE_SHUTDOWN_E2E: '1'
        run: node scripts/ci/naturalExit.js shutdown
      - name: Verify share evidence before teardown
        if: always() && startsWith(matrix.group, 'share')
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { spawnSync } = require('child_process')
          const { readBrokerVersion } = require('./testHelpers/brokerVersion')
          const files = fs.readdirSync('.tmp/e2e').filter(name => name.endsWith('.jsonl'))
            .map(name => `.tmp/e2e/${name}`)
          const result = spawnSync(process.execPath, [
            'scripts/evidence/verify.js', '--broker', readBrokerVersion(), ...files,
          ], { stdio: 'inherit' })
          if (result.error) throw result.error
          process.exitCode = result.status ?? 1
          NODE
      - name: Stop share cluster
        if: always() && startsWith(matrix.group, 'share')
        run: docker compose -f "$COMPOSE_FILE" down --remove-orphans
      - if: always() && startsWith(matrix.group, 'share')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group }}-${{ matrix.kafka }}-node${{ matrix.node }}
          path: .tmp/e2e/
          if-no-files-found: ignore
          include-hidden-files: true
  telemetry:
    needs: [unit]
    uses: ./.github/workflows/telemetry.yml
    with:
      full: false
