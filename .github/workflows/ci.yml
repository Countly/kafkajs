name: CI
on:
  push: { branches: [master] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run compat:check
      - run: npm run test:types
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [22, 24, 26] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run test:unit
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:pack
  integration:
    runs-on: ubuntu-latest
    needs: [unit]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { node: 24, kafka: 4.3.1, group: broker }
          - { node: 24, kafka: 4.3.1, group: admin }
          - { node: 24, kafka: 4.3.1, group: producer }
          - { node: 24, kafka: 4.3.1, group: consumer }
          - { node: 24, kafka: 4.3.1, group: others }
          - { node: 24, kafka: 4.3.1, group: oauthbearer, compose: docker-compose.oauthbearer.yml }
          - { node: 22, kafka: 4.3.1, group: broker }
          - { node: 22, kafka: 4.3.1, group: others }
          - { node: 26, kafka: 4.3.1, group: broker }
          - { node: 26, kafka: 4.3.1, group: others }
          - { node: 24, kafka: 4.3.1, group: share-base }
          - { node: 24, kafka: 4.4.0, group: share-base }
          - { node: 24, kafka: 4.3.1, group: share, compose: docker-compose.share.yml }
          - { node: 24, kafka: 4.4.0, group: share, compose: docker-compose.share.yml }
          - { node: 24, kafka: 4.3.1, group: share-limit, compose: docker-compose.share-limit.yml }
    env:
      KAFKA_VERSION: ${{ matrix.kafka }}
      COMPOSE_FILE: ${{ matrix.compose || 'docker-compose.yml' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: docker compose version
      # Share lanes run serially (--runInBand in their scripts), and Jest rejects --maxWorkers with it.
      - run: ./scripts/testWithKafka.sh "npm run test:group:${{ matrix.group }} -- --ci${{ !startsWith(matrix.group, 'share') && ' --maxWorkers=4' || '' }}"
      - if: always() && startsWith(matrix.group, 'share')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group }}-${{ matrix.kafka }}-node${{ matrix.node }}
          path: .tmp/e2e/
          if-no-files-found: ignore
