name: CI
on:
  push: { branches: [master] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run compat:check
      - run: npm run test:types
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [22, 24, 26] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run test:unit
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:pack
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 360 }}
    needs: [unit]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { node: 24, kafka: 4.3.1, group: broker }
          - { node: 24, kafka: 4.3.1, group: admin }
          - { node: 24, kafka: 4.3.1, group: producer }
          - { node: 24, kafka: 4.3.1, group: consumer }
          - { node: 24, kafka: 4.3.1, group: others }
          - { node: 24, kafka: 4.3.1, group: oauthbearer, compose: docker-compose.oauthbearer.yml }
          - { node: 22, kafka: 4.3.1, group: broker }
          - { node: 22, kafka: 4.3.1, group: others }
          - { node: 26, kafka: 4.3.1, group: broker }
          - { node: 26, kafka: 4.3.1, group: others }
          - { node: 24, kafka: 4.3.1, group: share-base, timeout: 35 }
          - { node: 24, kafka: 4.4.0, group: share-base, clients: 4.4.0 }
          - { node: 24, kafka: 4.3.1, group: share, compose: docker-compose.share.yml }
          - {
              node: 24,
              kafka: 4.4.0,
              group: share,
              compose: docker-compose.share.yml,
              clients: 4.4.0,
            }
          - { node: 24, kafka: 4.3.1, group: share-limit, compose: docker-compose.share-limit.yml }
    env:
      KAFKA_VERSION: ${{ matrix.kafka }}
      COMPOSE_FILE: ${{ matrix.compose || 'docker-compose.yml' }}
      KAFKA_CLIENTS_VERSION: ${{ matrix.clients || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: docker compose version
      - if: ${{ !startsWith(matrix.group, 'share') }}
        run: ./scripts/testWithKafka.sh "npm run test:group:${{ matrix.group }} -- --ci --maxWorkers=4"
      - name: Prepare share evidence
        if: startsWith(matrix.group, 'share')
        run: |
          echo "KAFKAJS_TREE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          rm -rf .tmp/e2e
          mkdir -p .tmp/e2e
      - name: Run share lane
        if: startsWith(matrix.group, 'share')
        env:
          DO_NOT_STOP: '1'
        run: ./scripts/testWithKafka.sh "npm run test:group:${{ matrix.group }} -- --ci"
      - name: Run share soak (natural exit)
        if: matrix.group == 'share-base' && matrix.kafka == '4.3.1'
        timeout-minutes: 18
        env:
          KAFKAJS_LANE: docker
          KAFKAJS_DEBUG_PROTOCOL_BUFFERS: '1'
          SHARE_SOAK_E2E: '1'
        run: node scripts/ci/naturalExit.js soak
      - name: Prove shutdown exits naturally
        if: matrix.group == 'share'
        env:
          KAFKAJS_LANE: docker
          KAFKAJS_DEBUG_PROTOCOL_BUFFERS: '1'
          SHARE_SHUTDOWN_E2E: '1'
        run: node scripts/ci/naturalExit.js shutdown
      - name: Verify share evidence before teardown
        if: always() && startsWith(matrix.group, 'share')
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { spawnSync } = require('child_process')
          const { readBrokerVersion } = require('./testHelpers/brokerVersion')
          const files = fs.readdirSync('.tmp/e2e').filter(name => name.endsWith('.jsonl'))
            .map(name => `.tmp/e2e/${name}`)
          const result = spawnSync(process.execPath, [
            'scripts/evidence/verify.js', '--broker', readBrokerVersion(), ...files,
          ], { stdio: 'inherit' })
          if (result.error) throw result.error
          process.exitCode = result.status ?? 1
          NODE
      - name: Stop share cluster
        if: always() && startsWith(matrix.group, 'share')
        run: docker compose -f "$COMPOSE_FILE" down --remove-orphans
      - if: always() && startsWith(matrix.group, 'share')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group }}-${{ matrix.kafka }}-node${{ matrix.node }}
          path: .tmp/e2e/
          if-no-files-found: ignore
          include-hidden-files: true
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              node: 22,
              kafka: 4.3.1,
              group: telemetry-reporter,
              compose: docker-compose.telemetry.yml,
            }
          - {
              node: 22,
              kafka: 4.2.2,
              group: telemetry-reporter,
              compose: docker-compose.telemetry.yml,
            }
          - { node: 22, kafka: 4.3.1, group: telemetry-base, compose: docker-compose.yml }
          - { node: 22, kafka: 4.2.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 22, kafka: 4.1.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 22, kafka: 4.0.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 22, kafka: 4.4.0, group: telemetry-base, compose: docker-compose.yml }
          - {
              node: 24,
              kafka: 4.3.1,
              group: telemetry-reporter,
              compose: docker-compose.telemetry.yml,
            }
          - {
              node: 24,
              kafka: 4.2.2,
              group: telemetry-reporter,
              compose: docker-compose.telemetry.yml,
            }
          - { node: 24, kafka: 4.3.1, group: telemetry-base, compose: docker-compose.yml }
          - { node: 24, kafka: 4.2.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 24, kafka: 4.1.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 24, kafka: 4.0.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 24, kafka: 4.4.0, group: telemetry-base, compose: docker-compose.yml }
          - {
              node: 26,
              kafka: 4.3.1,
              group: telemetry-reporter,
              compose: docker-compose.telemetry.yml,
            }
          - {
              node: 26,
              kafka: 4.2.2,
              group: telemetry-reporter,
              compose: docker-compose.telemetry.yml,
            }
          - { node: 26, kafka: 4.3.1, group: telemetry-base, compose: docker-compose.yml }
          - { node: 26, kafka: 4.2.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 26, kafka: 4.1.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 26, kafka: 4.0.2, group: telemetry-base, compose: docker-compose.yml }
          - { node: 26, kafka: 4.4.0, group: telemetry-base, compose: docker-compose.yml }
    env:
      KAFKA_VERSION: ${{ matrix.kafka }}
      COMPOSE_FILE: ${{ matrix.compose }}
      COMPOSE_PROJECT_NAME: telemetry-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      TF1_CACHE: ${{ github.workspace }}/.tmp/telemetry-cache
      TELEMETRY_JAVA_CACHE: ${{ github.workspace }}/.tmp/telemetry-cache
      TELEMETRY_EVIDENCE_DIR: ${{ github.workspace }}/.tmp/telemetry-evidence
      KAFKAJS_LANE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - if: matrix.group == 'telemetry-reporter'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
        timeout-minutes: 5
      - name: Prepare telemetry evidence
        timeout-minutes: 1
        run: |
          echo "KAFKAJS_TREE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p .tmp/e2e "$TELEMETRY_EVIDENCE_DIR"
          chmod 0777 "$TELEMETRY_EVIDENCE_DIR"
      - name: Verify retained jars offline and prepare decoder inputs
        if: matrix.group == 'telemetry-reporter'
        timeout-minutes: 4
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          timeout -k 5s 30s env -u TELEMETRY_JAVA_CACHE bash scripts/e2e/telemetry/run.sh verify "$KAFKA_VERSION"
          timeout -k 5s 180s bash scripts/e2e/telemetry/fetch.sh
          timeout -k 5s 30s bash scripts/e2e/telemetry/run.sh verify "$KAFKA_VERSION"
      - name: Run the observer checks with the independent Java decoder
        if: matrix.group == 'telemetry-reporter' && matrix.kafka == '4.3.1'
        timeout-minutes: 3
        env:
          TMPDIR: ${{ runner.temp }}
        run: timeout -k 10s 150s npx jest --runInBand --ci --testPathPatterns 'testHelpers/__tests__/telemetryFixtures\.spec\.js$'
      - name: Preflight isolated project ownership
        timeout-minutes: 2
        run: timeout -k 5s 90s node scripts/e2e/telemetry/ci.js preflight
      - name: Prepare broker image
        timeout-minutes: 4
        run: timeout -k 5s 210s docker compose -f "$COMPOSE_FILE" pull
      - name: Start and warm the owned telemetry cluster
        timeout-minutes: 6
        run: |
          timeout -k 5s 90s docker compose -f "$COMPOSE_FILE" up -d --pull never
          timeout -k 5s 240s node scripts/waitForKafka.js
      - name: Verify mounted reporter and capture broker identities
        timeout-minutes: 3
        run: timeout -k 5s 150s node scripts/e2e/telemetry/ci.js capture
      - name: Run telemetry lane
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: timeout -k 10s 270s npm run test:group:${{ matrix.group }} -- --ci
      - name: Verify telemetry evidence before teardown
        if: always()
        timeout-minutes: 3
        run: |
          timeout -k 5s 150s node <<'NODE'
          const fs = require('fs')
          const { spawnSync } = require('child_process')
          const { readBrokerVersion } = require('./testHelpers/brokerVersion')
          const { verifyEvidence } = require('./scripts/e2e/telemetry/evidence')
          const files = fs.readdirSync('.tmp/e2e').filter(name => name.endsWith('.jsonl'))
            .map(name => `.tmp/e2e/${name}`)
          const result = spawnSync(process.execPath, [
            'scripts/evidence/verify.js', '--broker', readBrokerVersion(), ...files,
          ], { stdio: 'inherit', timeout: 60000 })
          if (result.error) throw result.error
          if (result.status !== 0) throw new Error('Evidence stamp verification failed')
          verifyEvidence('${{ matrix.group }}', process.env.TELEMETRY_EVIDENCE_DIR, files)
          NODE
      - name: Stop owned project and prove container network volume removal
        if: always()
        timeout-minutes: 3
        run: |
          timeout -k 5s 150s node scripts/e2e/telemetry/ci.js stop
          node -e "require('./scripts/e2e/telemetry/evidence').verifyCleanup(process.env.TELEMETRY_EVIDENCE_DIR, '.tmp/e2e', process.env.COMPOSE_PROJECT_NAME)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group }}-${{ matrix.kafka }}-node${{ matrix.node }}
          path: |
            .tmp/e2e/
            .tmp/telemetry-evidence/
          if-no-files-found: error
          include-hidden-files: true
