# Telemetry arm (TF1): the three-node cluster of docker-compose.yml with the share-group settings of the share arm
# and the test-only CountingTelemetryReporter installed on every broker. The reporter advertises the broker side of
# KIP-714 (ApiVersions keys 71 and 72) and writes each decoded client push to a bounded JSONL sink.
#
# Select it with COMPOSE_FILE=docker-compose.telemetry.yml (one file path, project kafkajs). KAFKA_VERSION picks the
# image and the matching jar: scripts/e2e/telemetry/fixtures/counting-telemetry-reporter-${KAFKA_VERSION}.jar (4.3.1 or 4.2.2).
# TELEMETRY_EVIDENCE_DIR (host) is mounted at /var/telemetry-evidence on every broker; clear it before each arm.
# Quorum, listeners, auth and volumes are those of docker-compose.yml. Differences: no container_name, only the
# PLAINTEXT_HOST listener of each broker is published, and on host ports 19092/19095/19098 (the base ports 9092/9095/9098
# are not published). The PLAINTEXT_HOST listener of each broker also advertises that published port
# (localhost:19092/19095/19098), so a host client that follows Metadata reaches the right broker; in-cluster clients use INTERNAL.
x-kafka-common: &kafka-common
  image: apache/kafka:${KAFKA_VERSION:-4.3.1}
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: 'broker,controller'
    KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:19093,2@kafka2:19093,3@kafka3:19093'
    KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
    KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,SSL_HOST:SSL,SASL_SSL_HOST:SASL_SSL'
    CLUSTER_ID: '9JrAXWqaTk-meTZW2p46oA'
    KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    KAFKA_DEFAULT_REPLICATION_FACTOR: '2'
    KAFKA_NUM_PARTITIONS: '2'
    KAFKA_DELETE_TOPIC_ENABLE: 'true'
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
    KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS: '500'
    KAFKA_GROUP_CONSUMER_MIN_HEARTBEAT_INTERVAL_MS: '500'
    KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: '6000'
    KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS: '6000'
    KAFKA_GROUP_SHARE_MIN_RECORD_LOCK_DURATION_MS: '1000'
    KAFKA_GROUP_SHARE_SESSION_TIMEOUT_MS: '6000'
    KAFKA_GROUP_SHARE_MIN_SESSION_TIMEOUT_MS: '6000'
    KAFKA_GROUP_SHARE_HEARTBEAT_INTERVAL_MS: '1000'
    KAFKA_GROUP_SHARE_MIN_HEARTBEAT_INTERVAL_MS: '1000'
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '2'
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '2'
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
    KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: '2'
    KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: '1'
    KAFKA_CONNECTIONS_MAX_REAUTH_MS: '15000'
    KAFKA_AUTHORIZER_CLASS_NAME: 'org.apache.kafka.metadata.authorizer.StandardAuthorizer'
    KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'true'
    KAFKA_SUPER_USERS: 'User:ANONYMOUS'
    KAFKA_SSL_KEYSTORE_LOCATION: '/etc/kafka/secrets/kafka.server.keystore.jks'
    KAFKA_SSL_KEYSTORE_PASSWORD: 'testtest'
    KAFKA_SSL_KEY_PASSWORD: 'testtest'
    KAFKA_SSL_TRUSTSTORE_LOCATION: '/etc/kafka/secrets/kafka.server.truststore.jks'
    KAFKA_SSL_TRUSTSTORE_PASSWORD: 'testtest'
    KAFKA_SASL_ENABLED_MECHANISMS: 'PLAIN,SCRAM-SHA-256,SCRAM-SHA-512'
    KAFKA_OPTS: '-Djava.security.auth.login.config=/etc/kafka/secrets/server-jaas.conf'
    # Telemetry arm: reporter on every broker, broker-side payload cap 4096 bytes (L4), sink directory inside the container.
    KAFKA_METRIC_REPORTERS: 'org.countly.kafkajs.telemetry.CountingTelemetryReporter'
    KAFKA_TELEMETRY_MAX_BYTES: '4096'
    TELEMETRY_EVIDENCE_DIR: '/var/telemetry-evidence'
  volumes:
    - ./testHelpers/certs/kafka.server.keystore.jks:/etc/kafka/secrets/kafka.server.keystore.jks:ro,z
    - ./testHelpers/certs/kafka.server.truststore.jks:/etc/kafka/secrets/kafka.server.truststore.jks:ro,z
    - ./testHelpers/kafka/server-jaas.conf:/etc/kafka/secrets/server-jaas.conf:ro,z
    - ./scripts/e2e/telemetry/fixtures/counting-telemetry-reporter-${KAFKA_VERSION:-4.3.1}.jar:/opt/kafka/libs/counting-telemetry-reporter.jar:ro,z
    - ${TELEMETRY_EVIDENCE_DIR:-./.tmp/telemetry-evidence}:/var/telemetry-evidence:rw,z

services:
  kafka1:
    <<: *kafka-common
    hostname: kafka1
    labels: ['custom.project=kafkajs', 'custom.service=kafka1']
    ports: ['127.0.0.1:19092:9092']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '1'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9092,SSL_HOST://0.0.0.0:9093,SASL_SSL_HOST://0.0.0.0:9094,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:19093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:19092,SSL_HOST://localhost:9093,SASL_SSL_HOST://localhost:9094,INTERNAL://kafka1:29092'

  kafka2:
    <<: *kafka-common
    hostname: kafka2
    labels: ['custom.project=kafkajs', 'custom.service=kafka2']
    ports: ['127.0.0.1:19095:9095']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '2'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9095,SSL_HOST://0.0.0.0:9096,SASL_SSL_HOST://0.0.0.0:9097,INTERNAL://0.0.0.0:29095,CONTROLLER://0.0.0.0:19093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:19095,SSL_HOST://localhost:9096,SASL_SSL_HOST://localhost:9097,INTERNAL://kafka2:29095'

  kafka3:
    <<: *kafka-common
    hostname: kafka3
    labels: ['custom.project=kafkajs', 'custom.service=kafka3']
    ports: ['127.0.0.1:19098:9098']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '3'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9098,SSL_HOST://0.0.0.0:9099,SASL_SSL_HOST://0.0.0.0:9100,INTERNAL://0.0.0.0:29098,CONTROLLER://0.0.0.0:19093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:19098,SSL_HOST://localhost:9099,SASL_SSL_HOST://localhost:9100,INTERNAL://kafka3:29098'
